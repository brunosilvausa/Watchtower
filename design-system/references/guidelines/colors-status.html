<!-- @dsCard group="Colors" viewport="700x170" name="Status" subtitle="Up / down / degraded / info" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.row{display:grid;gap:12px}.s{display:flex;flex-direction:column;gap:4px}.c{height:64px;border-radius:var(--radius-md);border:1px solid var(--hairline)}.n{font-size:13px;font-weight:600;color:var(--on-dark)}.h{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}.p{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;margin-top:6px;width:max-content}.d{width:6px;height:6px;border-radius:50%;background:currentColor}</style></head><body class="wt-ambient"><div class="row" style="grid-template-columns:repeat(4,1fr)">
<div class="s"><div class="c" style="background:var(--status-up)"></div><div class="h">--status-up · #22c55e</div><span class="p" style="color:var(--status-up);background:var(--status-up-bg)"><i class="d"></i>Operational</span></div>
<div class="s"><div class="c" style="background:var(--status-down)"></div><div class="h">--status-down · #ef4444</div><span class="p" style="color:var(--status-down);background:var(--status-down-bg)"><i class="d"></i>Down</span></div>
<div class="s"><div class="c" style="background:var(--status-degraded)"></div><div class="h">--status-degraded · #f59e0b</div><span class="p" style="color:var(--status-degraded);background:var(--status-degraded-bg)"><i class="d"></i>Degraded</span></div>
<div class="s"><div class="c" style="background:var(--status-info)"></div><div class="h">--status-info · #3b82f6</div><span class="p" style="color:var(--status-info);background:var(--status-info-bg)"><i class="d"></i>Maintenance</span></div>
</div></body></html>
