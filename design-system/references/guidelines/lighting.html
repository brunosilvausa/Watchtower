<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.g>div{height:150px;border-radius:12px;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;border:1px solid var(--border-subtle);overflow:hidden;position:relative}.g b{font-size:13px;color:var(--text-primary);position:relative}.g code{font-size:10px;color:var(--text-tertiary);position:relative}</style></head><body style="background:var(--background-base)"><div class="g">

<div style="background:var(--atmosphere)"><b>Atmosphere</b><code>--atmosphere</code></div>
<div style="background:var(--atmosphere)"><span style="position:absolute;inset:0;background-image:var(--grain);opacity:.08;mix-blend-mode:overlay"></span><b>+ Grain</b><code>--grain (shown 2×)</code></div>
<div style="background:var(--background-base)"><span style="position:absolute;left:14px;right:14px;top:30px;height:40px;border-radius:8px;background:var(--neon-reflection);border:1px solid var(--border-default);box-shadow:var(--elev-2-edge)"></span><span style="position:absolute;left:0;right:0;top:0;height:90px;background:var(--neon-reflection-under)"></span><b>Neon reflection</b><code>active rows only</code></div>
</div></body></html>
