<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.row{display:grid;gap:12px}.s{display:flex;flex-direction:column;gap:4px}.c{height:64px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.n{font-size:13px;font-weight:600;color:var(--text-primary)}.h{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}.box{padding:14px;border-radius:12px}</style></head><body class="wt-ambient"><div class="box wt-mat-frosted"><div class="row" style="grid-template-columns:repeat(6,1fr)"><div class="s"><div class="c" style="background:var(--surface-nested)"></div><div class="n">Nested</div><div class="h">--surface-nested<br>white 4%</div></div><div class="s"><div class="c" style="background:var(--surface-nested-strong)"></div><div class="n">Nested strong</div><div class="h">--surface-nested-strong<br>white 7%</div></div><div class="s"><div class="c" style="background:var(--surface-inset)"></div><div class="n">Inset well</div><div class="h">--surface-inset<br>black 26%</div></div><div class="s"><div class="c" style="border:1px solid var(--border-subtle)"></div><div class="n">Border subtle</div><div class="h">white 7%</div></div><div class="s"><div class="c" style="border:1px solid var(--border-default)"></div><div class="n">Border default</div><div class="h">white 12%</div></div><div class="s"><div class="c" style="border:1px solid var(--border-strong)"></div><div class="n">Border strong</div><div class="h">white 18%</div></div></div></div></body></html>
