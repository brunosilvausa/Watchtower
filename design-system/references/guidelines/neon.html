<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.r{display:flex;gap:20px;align-items:center}.k{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);margin-top:8px}</style></head><body class="wt-ambient"><div class="r">
<div><span style="display:inline-flex;align-items:center;height:40px;padding:0 20px;border-radius:8px;font-weight:600;font-size:14px;color:var(--primary-foreground);background:var(--material-neon-bg);border:1px solid var(--material-neon-border);box-shadow:var(--material-neon-edge),0 2px 0 rgba(0,0,0,.45),var(--elev-2-shadow),var(--glow-primary)">Primary · hover</span><div class="k">--glow-primary</div></div>

<div><span style="font-size:40px;font-weight:700;letter-spacing:-1.5px;color:var(--primary);text-shadow:var(--glow-text-neon)">99.98%</span><div class="k">--glow-text-neon</div></div>
</div></body></html>
